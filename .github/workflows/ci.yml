name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      - name: TUI Tests
        run: npm run test:tui

      - name: Integration Tests
        run: npm run test:int

      - name: Build Source
        run: npm run build

      - name: Bundle Build
        run: npm run bundle
